name: Daily Pintland Post

# No schedule here: GitHub's cron ran hours late. A Claude scheduled task presses
# "Run workflow" at 8:30 AM US Eastern instead.
on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python send_message.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
